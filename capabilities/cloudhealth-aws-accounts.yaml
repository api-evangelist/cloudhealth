naftiko: 1.0.0-alpha2
info:
  label: CloudHealth REST API — AWS Accounts
  description: 'CloudHealth REST API — AWS Accounts. 5 operations. Lead operation: List AWS accounts. Self-contained Naftiko
    capability covering one Cloudhealth business surface.'
  tags:
  - Cloudhealth
  - AWS Accounts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CLOUDHEALTH_API_KEY: CLOUDHEALTH_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloudhealth-aws-accounts
    baseUri: https://chapi.cloudhealthtech.com
    description: CloudHealth REST API — AWS Accounts business capability. Self-contained, no shared references.
    resources:
    - name: v1-aws_accounts
      path: /v1/aws_accounts
      operations:
      - name: listawsaccounts
        method: GET
        description: List AWS accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
        - name: per_page
          in: query
          type: integer
      - name: enableawsaccount
        method: POST
        description: Enable an AWS account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-aws_accounts-id
      path: /v1/aws_accounts/{id}
      operations:
      - name: getawsaccount
        method: GET
        description: Get an AWS account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
      - name: updateawsaccount
        method: PUT
        description: Update an AWS account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteawsaccount
        method: DELETE
        description: Delete an AWS account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.CLOUDHEALTH_API_KEY}}'
  exposes:
  - type: rest
    namespace: cloudhealth-aws-accounts-rest
    port: 8080
    description: REST adapter for CloudHealth REST API — AWS Accounts. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/aws-accounts
      name: v1-aws-accounts
      description: REST surface for v1-aws_accounts.
      operations:
      - method: GET
        name: listawsaccounts
        description: List AWS accounts
        call: cloudhealth-aws-accounts.listawsaccounts
        with:
          page: rest.page
          per_page: rest.per_page
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: enableawsaccount
        description: Enable an AWS account
        call: cloudhealth-aws-accounts.enableawsaccount
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/aws-accounts/{id}
      name: v1-aws-accounts-id
      description: REST surface for v1-aws_accounts-id.
      operations:
      - method: GET
        name: getawsaccount
        description: Get an AWS account
        call: cloudhealth-aws-accounts.getawsaccount
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateawsaccount
        description: Update an AWS account
        call: cloudhealth-aws-accounts.updateawsaccount
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteawsaccount
        description: Delete an AWS account
        call: cloudhealth-aws-accounts.deleteawsaccount
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloudhealth-aws-accounts-mcp
    port: 9090
    transport: http
    description: MCP adapter for CloudHealth REST API — AWS Accounts. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-aws-accounts
      description: List AWS accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloudhealth-aws-accounts.listawsaccounts
      with:
        page: tools.page
        per_page: tools.per_page
      outputParameters:
      - type: object
        mapping: $.
    - name: enable-aws-account
      description: Enable an AWS account
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloudhealth-aws-accounts.enableawsaccount
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-aws-account
      description: Get an AWS account
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloudhealth-aws-accounts.getawsaccount
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-aws-account
      description: Update an AWS account
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: cloudhealth-aws-accounts.updateawsaccount
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-aws-account
      description: Delete an AWS account
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: cloudhealth-aws-accounts.deleteawsaccount
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.

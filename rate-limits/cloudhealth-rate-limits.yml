specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: CloudHealth
providerId: cloudhealth
created: '2026-05-04'
modified: '2026-09-16'
generated: '2026-09-16'
method: searched
source: https://knowledge.broadcom.com/external/article/420604/cloudhealth-rest-and-graphql-api-rate-li.html
docs:
  - https://knowledge.broadcom.com/external/article/420604/cloudhealth-rest-and-graphql-api-rate-li.html
  - https://apidocs.cloudhealthtech.com/
note: >-
  Replaces a 2026-05-04 bulk-sweep scaffold whose tiered quotas and X-RateLimit-* headers were placeholders.
  Values below are the provider's published limits. No rate-limit response headers are documented and none
  were observed on unauthenticated responses from chapi.cloudhealthtech.com (2026-09-16).
limit_count: 4
headers: {}
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: REST API client limit
    applies: [CloudHealth REST API (https://chapi.cloudhealthtech.com)]
    scope: per-client
    limit: 30
    window: 1 minute
    source: https://knowledge.broadcom.com/external/article/420604/cloudhealth-rest-and-graphql-api-rate-li.html
  - name: GraphQL API client limit
    applies: [CloudHealth GraphQL API (https://apps.cloudhealthtech.com/graphql)]
    scope: per-client
    limit: 60
    window: 1 minute
    source: https://knowledge.broadcom.com/external/article/420604/cloudhealth-rest-and-graphql-api-rate-li.html
  - name: Metrics API POST limit
    applies: [POST metrics upload]
    scope: per-api-key (user)
    limit: 60
    window: 1 minute
    method: POST
    note: Read requests are not throttled. A payload can hold up to 1000 data points, so a client can push
      60,000 data points per minute. On 429, retry with exponential backoff.
    source: https://apidocs.cloudhealthtech.com/
  - name: Organization API write limit
    applies: [Create Organization, Assign Account to Organization, Replace Existing Organization Account Assignment]
    scope: per-api-key (user)
    limit: 500
    window: 10 minutes
    source: https://apidocs.cloudhealthtech.com/
policies:
  - name: Backoff
    description: The Metrics API guide says the client should handle a 429 and retry with exponential backoff; the
      Broadcom KB advises adding a delay to any polling automation.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com

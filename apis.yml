description: CloudHealth (now VMware Tanzu CloudHealth, owned by Broadcom) is a multi-cloud financial and operational
  management platform. It provides cost visibility, optimization recommendations, asset inventory, custom perspectives
  (groupings), policies, governance, and partner/MSP billing workflows across AWS, Azure, GCP, Oracle, and data
  center environments. The platform exposes both a REST API and a GraphQL API for programmatic access to reports,
  assets, accounts, perspectives, tags, metrics, and partner customer provisioning.
apis:
- aid: cloudhealth:cloudhealth-graphql-api
  name: CloudHealth GraphQL API
  description: GraphQL API at a single endpoint (https://apps.cloudhealthtech.com/graphql) covering budgets, FlexReports,
    FlexOrgs, saved reports, savings plan and commitment recommendations, cost reallocation and GCP billing accounts.
    Clients exchange an API key for a 15-minute access token with the loginAPI mutation.
  humanURL: https://help.cloudhealthtech.com/graphql-api/
  baseURL: https://apps.cloudhealthtech.com/graphql
  tags:
  - GraphQL
